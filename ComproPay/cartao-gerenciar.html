<!doctype html>
<html lang="pt-BR">
<head>
<script src="../scripts/portao.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComproPay — Gerenciar cartão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<script src="js/embed.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/device-frame.css">
<script src="js/device-frame.js" defer></script>
</head>
<body>
<main class="screen">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="statusbar__icons"><img src="assets/icons/statusbar-cellular.svg" alt=""><img src="assets/icons/statusbar-wifi.svg" alt=""><svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="#000" opacity=".35"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#000"/></svg></span>
  </div>
  <header class="topbar">
    <a class="topbar__back" href="cartoes.html" aria-label="Voltar"><img src="assets/icons/arrow-left.svg" alt=""></a>
    <h1 class="topbar__title">Gerenciar cartão</h1>
    <span></span>
  </header>
  <div class="manage-card">
    <div class="manage-card__preview" style="background-image:url(assets/img/card-alimentacao-lg.png)">
      <span class="manage-card__chip">Alimentação</span>
      <div class="manage-card__foot">
        <div>
          <p>Saldo do cartão</p>
          <p>R$300,00</p>
        </div>
        <div>
          <p>Principal</p>
          <p>•••• 8393</p>
        </div>
      </div>
    </div>
    <ul class="manage-list">
      <li><a class="manage-item" href="extrato.html"><img src="assets/icons/receipt.svg" alt=""><span>Ver extrato</span><img src="assets/icons/chevron-muted.svg" alt=""></a></li>
      <li><a class="manage-item" href="#"><img src="assets/icons/card-rede.svg" alt=""><span>Rede credenciada</span><img src="assets/icons/chevron-muted.svg" alt=""></a></li>
      <li><a class="manage-item" href="#"><img src="assets/icons/card-lock.svg" alt=""><span>Bloquear cartão</span><img src="assets/icons/chevron-muted.svg" alt=""></a></li>
      <li><a class="manage-item manage-item--danger" href="#"><img src="assets/icons/card-excluir.svg" alt=""><span>Excluir cartão</span><img src="assets/icons/chevron-muted.svg" alt=""></a></li>
    </ul>
  </div>
