<!doctype html>
<html lang="pt-BR" data-kit-page="space">
<head>
<script src="../../../scripts/portao.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space — ComproPay UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../assets/kit.css">
<script>var KIT_BASE = '../';</script>
</head>
<body class="kit">
<header class="kit-topbar">
  <div class="kit-topbar__brand"><a href="../index.html" id="kit-home-link">← UI Kit</a></div>
  <div class="kit-topbar__meta">css/tokens.css</div>
</header>
<div class="kit-layout">
  <aside class="kit-sidebar">
    <a class="kit-sidebar__home" id="kit-home-link-row" href="../index.html">Home</a>
    <input class="kit-search" id="kit-search" type="search" placeholder="Buscar…">
    <nav id="kit-nav"></nav>
  </aside>
  <div class="kit-main">
    <div class="kit-crumb" id="kit-crumb"></div>
    <h1>Space</h1>
    <p class="kit-lede">Escala de 4px. Fechei os buracos (28, 32) e estendi até 64 pra layouts maiores que ainda não existem no app.</p>
    <div class="kit-legend"><span><i class="use"></i> em uso numa tela</span><span><i class="new"></i> novo — gerado pra fechar a escala</span></div>

    <div id="space-scale"></div>

    <div class="kit-prevnext" id="kit-prevnext"></div>
  </div>
</div>
<script src="../assets/kit.js"></script>
<script>
  var SPACE_SCALE = [
    ['--space-1', 4], ['--space-2', 8], ['--space-3', 12], ['--space-4', 16],
    ['--space-5', 20], ['--space-6', 24], ['--space-7', 28, 1], ['--space-8', 32, 1], ['--space-9', 36],
    ['--space-10', 40, 1], ['--space-12', 48, 1], ['--space-16', 64, 1]
  ];
  var spaceEl = document.getElementById('space-scale');
  SPACE_SCALE.forEach(function (it) {
    var row = document.createElement('div'); row.className = 'kit-space-row';
    row.innerHTML =
      (it[2] ? '<span class="kit-pill kit-pill--new" style="position:static;margin-right:4px">novo</span>' : '<span style="width:46px;display:inline-block"></span>') +
      '<span class="kit-space-row__meta">' + it[0] + ' · ' + it[1] + 'px</span>' +
      '<span class="kit-space-row__bar" style="width:var(' + it[0] + ')"></span>';
    spaceEl.appendChild(row);
  });
</script>
</body>
</html>
