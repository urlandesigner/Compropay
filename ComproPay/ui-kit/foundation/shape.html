<body class="kit">
<header class="kit-topbar">
  <div class="kit-topbar__brand"><a href="../index.html" id="kit-home-link">← UI Kit</a></div>
  <div class="kit-topbar__meta">css/tokens.css</div>
</header>
<div class="kit-layout">
  <aside class="kit-sidebar">
    <a class="kit-sidebar__home" id="kit-home-link-row" href="../index.html">Home</a>
    <input class="kit-search" id="kit-search" type="search" placeholder="Buscar…">
    <nav id="kit-nav"></nav>
  </aside>
  <div class="kit-main">
    <div class="kit-crumb" id="kit-crumb"></div>
    <h1>Shape</h1>
    <p class="kit-lede">Raios de borda. No Figma, <code>--radius-sm</code> aparece como "radius-lg" — o valor bate (12px), só o nome local é diferente; mantido assim pra não quebrar quem já usa.</p>

    <div class="kit-cards-row" id="radius-scale"></div>

    <div class="kit-prevnext" id="kit-prevnext"></div>
  </div>
</div>
<script src="../assets/kit.js"></script>
<script>
  var RADIUS_SCALE = [
    ['--radius-sm', '12px'], ['--radius-md', '16px'], ['--radius-lg', '20px'],
    ['--radius-xl', '24px'], ['--radius-pill', '999px']
  ];
  var radiusEl = document.getElementById('radius-scale');
  RADIUS_SCALE.forEach(function (it) {
    var card = document.createElement('div'); card.className = 'kit-radius-card';
    card.innerHTML = '<div class="kit-radius-box" style="border-radius:var(' + it[0] + ')"></div><span>' + it[0] + ' · ' + it[1] + '</span>';
    radiusEl.appendChild(card);
  });
</script>
</body>
</html>
