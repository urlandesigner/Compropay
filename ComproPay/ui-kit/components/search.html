<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">

<body class="kit">
<header class="kit-topbar">
  <div class="kit-topbar__brand"><a href="../index.html" id="kit-home-link">← UI Kit</a></div>
  <div class="kit-topbar__meta">css/base.css</div>
</header>
<div class="kit-layout">
  <aside class="kit-sidebar">
    <a class="kit-sidebar__home" id="kit-home-link-row" href="../index.html">Home</a>
    <input class="kit-search" id="kit-search" type="search" placeholder="Buscar…">
    <nav id="kit-nav"></nav>
  </aside>
  <div class="kit-main">
    <div class="kit-crumb" id="kit-crumb"></div>
    <h1>Search field</h1>
    <p class="kit-lede">Campo de busca usado em Ajuda e Pagar. É um <code>&lt;label&gt;</code> inteiro clicável, com o ícone antes do <code>&lt;input&gt;</code>.</p>
    <div class="kit-base-class"><b>Classes</b> <code>.search</code></div>

    <div class="kit-group">
      <h2>Variantes</h2>
      <div class="kit-preview">
        <div class="kit-variant">
          <label class="search" style="max-width:300px"><img src="../../assets/icons/search.svg" alt=""><input class="composer__input" type="search" placeholder="Pesquisar" aria-label="Pesquisar" style="font-family:var(--font-body);font-weight:400;font-size:14px;color:inherit"></label>
          <span class="kit-variant__label">vazio</span>
        </div>
        <div class="kit-variant">
          <label class="search search--filled" style="max-width:300px"><img src="../../assets/icons/search.svg" alt=""><input class="composer__input" type="search" value="restaurantes" aria-label="Pesquisar" style="font-family:var(--font-body);font-weight:600;font-size:14px;color:inherit"></label>
          <span class="kit-variant__label">.search--filled — com texto digitado</span>
        </div>
      </div>
    </div>

    <div class="kit-prevnext" id="kit-prevnext"></div>
  </div>
</div>
<script src="../assets/kit.js"></script>
