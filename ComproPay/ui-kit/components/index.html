<!doctype html>
<html lang="pt-BR" data-kit-page="cmp-index">
<head>
<script src="../../../scripts/portao.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components — ComproPay UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../assets/kit.css">
<script>var KIT_BASE = '../';</script>
</head>
<body class="kit">
<header class="kit-topbar">
  <div class="kit-topbar__brand"><a href="../index.html" id="kit-home-link">← UI Kit</a></div>
  <div class="kit-topbar__meta">css/base.css</div>
</header>
<div class="kit-layout">
  <aside class="kit-sidebar">
    <a class="kit-sidebar__home" id="kit-home-link-row" href="../index.html">Home</a>
    <input class="kit-search" id="kit-search" type="search" placeholder="Buscar…">
    <nav id="kit-nav"></nav>
  </aside>
  <div class="kit-main">
    <div class="kit-crumb" id="kit-crumb"></div>
    <h1>Components</h1>
    <p class="kit-lede">As peças reutilizáveis — botões, campos, cartões. Markup real, copiado das telas já construídas.</p>

    <div class="kit-filters" id="kit-filters">
      <button class="kit-filter" type="button" data-filter="all" aria-pressed="true">Todos</button>
      <button class="kit-filter" type="button" data-filter="Átomo" aria-pressed="false">Átomos</button>
      <button class="kit-filter" type="button" data-filter="Molécula" aria-pressed="false">Moléculas</button>
    </div>

    <div class="kit-cmp-grid" id="kit-cmp-grid"></div>
  </div>
</div>
<script src="../assets/kit.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var items = window.KIT_NAV[1].items.filter(function (it) { return it.id !== 'cmp-index'; });
    var grid = document.getElementById('kit-cmp-grid');
    items.forEach(function (it) {
      var a = document.createElement('a');
      a.className = 'kit-cmp-card'; a.href = (window.KIT_BASE || '../') + it.href; a.dataset.kind = it.kind;
      a.innerHTML = '<span class="kit-cmp-card__kind">' + it.kind + '</span><h3>' + it.label + '</h3><p>' + (window.KIT_DESC[it.id] || '') + '</p>';
      grid.appendChild(a);
    });
    document.querySelectorAll('.kit-filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.kit-filter').forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
        var f = btn.dataset.filter;
        document.querySelectorAll('.kit-cmp-card').forEach(function (card) {
          card.style.display = (f === 'all' || card.dataset.kind === f) ? '' : 'none';
        });
      });
    });
  });
</script>
</body>
</html>
