<!doctype html>
<html lang="pt-BR">
<head>
<script src="../scripts/portao.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComproPay — Cobrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<script src="js/embed.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/device-frame.css">
<script src="js/device-frame.js" defer></script>
</head>
<body>
<main class="screen">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="statusbar__icons"><img src="assets/icons/statusbar-cellular.svg" alt=""><img src="assets/icons/statusbar-wifi.svg" alt=""><svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="#000" opacity=".35"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#000"/></svg></span>
  </div>
  <header class="topbar">
    <a class="topbar__back" href="receber-qr.html" aria-label="Voltar"><img src="assets/icons/arrow-left.svg" alt=""></a>
    <h1 class="topbar__title">Cobrar</h1>
    <span></span>
  </header>
  <div class="newcard">
    <h2 class="charge__title">Cobrar</h2>
    <p class="charge__lede">Quanto você quer cobrar?</p>
    <input class="charge__amount" id="amount" inputmode="decimal" placeholder="R$0,00" aria-label="Valor a cobrar">
    <a class="charge__skip" href="receber-qr.html">Não informar valor</a>
  </div>
  <div class="newcard-cta">
    <a class="btn-cta" id="cta" href="receber-qr.html" data-component="BotaoPrimario" data-props="texto, onClick, desabilitado" data-states="padrao, desabilitado" data-state="padrao" data-ds="button">Enviar cobrança</a>
  </div>
</main>
<script>
  var input = document.getElementById('amount');
  input.addEventListener('input', function () {
    var digits = input.value.replace(/\D/g, '');
    if (!digits) { input.value = ''; return; }
    var cents = parseInt(digits, 10);
    input.value = 'R$' + (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  });
</script>
</body>
</html>
