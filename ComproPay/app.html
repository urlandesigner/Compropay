<!doctype html>
<html lang="pt-BR">
<head>
<script src="../scripts/portao.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComproPay — App no celular</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/device-frame.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: 308px 1fr; overflow: hidden;
    font-family: var(--font-body); color: var(--color-text);
    background: radial-gradient(1200px 700px at 70% 40%, #efeaf7 0%, #e3e0ea 60%, #d9d6e0 100%);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  input { font: inherit; color: inherit; }

  /* ---------- Painel ---------- */
  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--color-surface); border-right: .5px solid var(--color-border); }

  .panel__brand { display: flex; align-items: center; gap: 12px; padding: 18px 20px 16px; border-bottom: 1px solid var(--color-border); }
  .panel__mark { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--color-brand) 0%, var(--color-brand-900) 100%); box-shadow: 0 3px 8px rgb(124 18 200 / .35); }
  .panel__mark svg { width: 18px; height: 18px; }
  .panel__brand-text { min-width: 0; }
  .panel__title { margin: 0; font-family: var(--font-display); font-weight: var(--fw-black); font-size: 16px; color: var(--color-text); letter-spacing: -.01em; }
  .panel__meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .panel__meta-dot { width: 6px; height: 6px; border-radius: 50%; background: #3ecf6e; box-shadow: 0 0 0 2.5px rgb(62 207 110 / .18); flex: none; }
  .panel__meta-text { font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  .panel__toolbar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 14px 20px 10px; }
  .tool-btn { height: 38px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--color-border); background: var(--color-surface); font-size: 12px; font-weight: 600; color: var(--color-text); transition: border-color .15s, color .15s, background .15s; }
  .tool-btn svg { flex: none; width: 15px; height: 15px; color: var(--color-text-muted); transition: color .15s; }
  .tool-btn:hover { border-color: var(--color-brand); color: var(--color-brand-700); background: var(--color-surface-soft); }
  .tool-btn:hover svg { color: var(--color-brand); }
  .tool-btn:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 1px; }

  .panel__search { position: relative; padding: 2px 20px 14px; }
  .panel__search svg { position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--color-text-muted); pointer-events: none; }
  .panel__search input { width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 10px; border: 1px solid var(--color-border); background: var(--color-surface-muted); font-size: 13px; }
  .panel__search input:focus { outline: none; border-color: var(--color-brand); background: var(--color-surface); }
  .panel__search input::placeholder { color: var(--color-text-muted); }

  .panel__nav { flex: 1; overflow-y: auto; padding: 4px 12px 24px; }
  .nav-group + .nav-group { margin-top: 2px; }
  .nav-group__head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 9px; text-align: left; }
  .nav-group__head:hover { background: var(--color-surface-muted); }
  .nav-group__icon { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--color-purple-50); color: var(--color-brand); }
  .nav-group__icon svg { width: 16px; height: 16px; }
  .nav-group__label { flex: 1; font-size: 13.5px; font-weight: 700; color: var(--color-text); }
  .nav-group__count { font: 600 10.5px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--color-text-muted); background: var(--color-surface-muted); padding: 3px 7px; border-radius: 999px; }
  .nav-group__chevron { flex: none; width: 16px; height: 16px; color: var(--color-text-muted); transition: transform .15s; }
  .nav-group__head[aria-expanded="true"] .nav-group__chevron { transform: rotate(180deg); }

  .nav-group__list { list-style: none; margin: 2px 0 10px; padding: 0 0 0 38px; display: flex; flex-direction: column; gap: 1px; }
  .nav-group__list[hidden] { display: none; }
  .screen-link { position: relative; display: block; width: 100%; padding: 7px 10px; border-radius: 7px; text-align: left; font-size: 13px; color: var(--color-text-muted); }
  .screen-link:hover { background: var(--color-surface-muted); color: var(--color-text); }
  .screen-link[aria-current="true"] { background: var(--color-purple-50); color: var(--color-brand-900); font-weight: 700; box-shadow: inset 3px 0 0 var(--color-brand); }
  .screen-link:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .panel { max-height: 44vh; border-right: 0; border-bottom: .5px solid var(--color-border); }
  }
</style>
</head>
<body>
<aside class="panel" aria-label="Telas do app">
  <div class="panel__brand">
    <div class="panel__mark" aria-hidden="true">
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 1.5 16 9l-7 7.5L2 9l7-7.5Z" fill="#fff" fill-opacity=".92"/><path d="M9 5 13 9l-4 4.5L5 9l4-4Z" fill="#7C12C8"/></svg>
    </div>
    <div class="panel__brand-text">
      <p class="panel__title">ComproPay</p>
      <div class="panel__meta"><span class="panel__meta-dot"></span><span class="panel__meta-text" id="meta">— telas · localhost:5173</span></div>
    </div>
  </div>

  <div class="panel__toolbar">
    <button class="tool-btn" type="button" id="restart"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8a5.5 5.5 0 1 0 1.8-4.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3.5 3v3.2h3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Reiniciar</button>
    <a class="tool-btn" href="telas.html"><svg viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8.5" y="2.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="8.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8.5" y="8.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Índice</a>
  </div>

  <div class="panel__search">
    <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="m13 13-2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="search" id="search" placeholder="Buscar tela…" aria-label="Buscar tela">
  </div>

  <nav class="panel__nav" id="list"></nav>
</aside>

<main class="stage" id="stage">
  <div class="sizer" id="sizer">
    <div class="phone" id="phone">
      <div class="phone__btn phone__btn--action"></div>
      <div class="phone__btn phone__btn--vol-up"></div>
      <div class="phone__btn phone__btn--vol-down"></div>
      <div class="phone__btn phone__btn--power"></div>
      <div class="phone__screen">
        <div class="island"></div>
        <iframe id="frame" title="App ComproPay" src="home-1-cartao.html"></iframe>
        <div class="phone__glare"></div>
        <div class="indicator"></div>
      </div>
    </div>
  </div>
</main>

<script>
  var ICONS = {
    login: '<path d="M7 9h8m0 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 3.5H4.5A1.5 1.5 0 0 0 3 5v8a1.5 1.5 0 0 0 1.5 1.5H7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    home: '<path d="M3 8.5 9 3l6 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 7.5V15h9V7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    extrato: '<rect x="4" y="2.5" width="10" height="13" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 6h5M6.5 9h5M6.5 12h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    cartoes: '<rect x="2.5" y="4.5" width="13" height="9" rx="1.8" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7.5h13" stroke="currentColor" stroke-width="1.4"/><path d="M5 11h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    ajuda: '<circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M7 7.2c.3-1 1.1-1.5 2-1.5 1.1 0 2 .7 2 1.8 0 1-.7 1.4-1.5 1.9-.5.3-.5.8-.5 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="9" cy="12.6" r=".75" fill="currentColor"/>',
    pagar: '<path d="M4.5 13.5 13.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 4.5h6.5V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    receber: '<path d="M13.5 4.5 4.5 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11 13.5H4.5V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    favoritos: '<path d="M5 3h8v12l-4-2.6L5 15V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    vantagens: '<path d="M9 2.5l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6L9 2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>'
  };
  var CHEVRON = '<path d="M5 7l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';

  var GROUPS = [
    { id: 'login', name: 'Login', icon: 'login', items: [
      ['login.html', 'Boas-vindas']
    ]},
    { id: 'home', name: 'Home', icon: 'home', items: [
      ['home-1-cartao.html', '1 cartão'],
      ['home-2-cartoes.html', '2 cartões'],
      ['home-sem-cartao.html', 'Sem cartão'],
      ['home-1-cartao-oculto.html', '1 cartão · saldo oculto'],
      ['home-2-cartoes-oculto.html', '2 cartões · saldo oculto'],
      ['home-sem-cartao-oculto.html', 'Sem cartão · saldo oculto']
    ]},
    { id: 'extrato', name: 'Extrato', icon: 'extrato', items: [
      ['extrato.html', 'Lista de transações'],
      ['extrato-transacao.html', 'Detalhe da transação'],
      ['extrato-transacao-menu.html', 'Detalhe com menu de opções']
    ]},
    { id: 'cartoes', name: 'Cartões', icon: 'cartoes', items: [
      ['cartoes.html', 'Meus cartões'],
      ['cartao-arte.html', 'Novo cartão · escolher arte'],
      ['cartao-dados.html', 'Novo cartão · dados'],
      ['cartao-confirmar.html', 'Novo cartão · pronto'],
      ['cartao-gerenciar.html', 'Gerenciar cartão']
    ]},
    { id: 'ajuda', name: 'Ajuda', icon: 'ajuda', items: [
      ['ajuda.html', 'Central de ajuda'],
      ['ajuda-chat.html', 'Chat com a Lia']
    ]},
    { id: 'pagar', name: 'Pagar', icon: 'pagar', items: [
      ['pagar.html', 'Escolher destinatário'],
      ['pagar-qr.html', 'Ler QR code'],
      ['pagar-proximos.html', 'Próximos de mim'],
      ['pagar-busca.html', 'Resultado da pesquisa'],
      ['pagar-valor.html', 'Valor do pagamento'],
      ['pagar-valor-recorrente.html', 'Pagamento recorrente']
    ]},
    { id: 'receber', name: 'Receber', icon: 'receber', items: [
      ['receber-qr.html', 'Meu QR code'],
      ['receber-valor.html', 'Cobrar valor']
    ]},
    { id: 'favoritos', name: 'Favoritos', icon: 'favoritos', items: [
      ['favoritar.html', 'Favoritar estabelecimento'],
      ['meus-favoritos.html', 'Meus favoritos']
    ]},
    { id: 'vantagens', name: 'Vantagens', icon: 'vantagens', items: [
      ['vantagens.html', 'Até 3 vantagens'],
      ['vantagens-mais.html', 'Mais de 3 vantagens'],
      ['vantagens-detalhe.html', 'Detalhe da vantagem']
    ]}
  ];

  var START = 'home-1-cartao.html';
  var frame = document.getElementById('frame');
  var list = document.getElementById('list');
  var meta = document.getElementById('meta');
  var groupOf = {}, totalScreens = 0;

  GROUPS.forEach(function (g) {
    var wrap = document.createElement('div'); wrap.className = 'nav-group';

    var head = document.createElement('button');
    head.type = 'button'; head.className = 'nav-group__head'; head.setAttribute('aria-expanded', 'false');
    head.innerHTML =
      '<span class="nav-group__icon"><svg viewBox="0 0 18 18" fill="none">' + ICONS[g.icon] + '</svg></span>' +
      '<span class="nav-group__label">' + g.name + '</span>' +
      '<span class="nav-group__count">' + g.items.length + '</span>' +
      '<svg class="nav-group__chevron" viewBox="0 0 18 18" fill="none">' + CHEVRON + '</svg>';
    wrap.appendChild(head);

    var ul = document.createElement('ul'); ul.className = 'nav-group__list'; ul.hidden = true;
    g.items.forEach(function (it) {
      groupOf[it[0]] = wrap;
      totalScreens++;
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'screen-link'; b.textContent = it[1];
      b.dataset.name = it[0]; b.dataset.label = (g.name + ' ' + it[1]).toLowerCase();
      b.addEventListener('click', function () { go(it[0]); });
      li.appendChild(b); ul.appendChild(li);
    });
    wrap.appendChild(ul);

    head.addEventListener('click', function () {
      var open = head.getAttribute('aria-expanded') !== 'true';
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
      ul.hidden = !open;
    });

    list.appendChild(wrap);
  });
  meta.textContent = totalScreens + ' telas · localhost:5173';

  function openGroup(wrap) {
    var head = wrap.querySelector('.nav-group__head'), ul = wrap.querySelector('.nav-group__list');
    head.setAttribute('aria-expanded', 'true'); ul.hidden = false;
  }
  function closeOthers(except) {
    [].forEach.call(list.querySelectorAll('.nav-group'), function (wrap) {
      if (wrap !== except) {
        wrap.querySelector('.nav-group__head').setAttribute('aria-expanded', 'false');
        wrap.querySelector('.nav-group__list').hidden = true;
      }
    });
  }

  function mark(name) {
    [].forEach.call(list.querySelectorAll('.screen-link'), function (el) {
      el.setAttribute('aria-current', el.dataset.name === name ? 'true' : 'false');
    });
    var g = groupOf[name];
    if (g) { closeOthers(g); openGroup(g); }
  }
  function go(name) { frame.src = name; mark(name); }

  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow || !e.data || e.data.type !== 'compropay:screen') return;
    mark(e.data.name);
  });
  document.getElementById('restart').addEventListener('click', function () { go(START); });

  var search = document.getElementById('search');
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    [].forEach.call(list.querySelectorAll('.nav-group'), function (wrap) {
      var items = [].slice.call(wrap.querySelectorAll('.screen-link'));
      var any = false;
      items.forEach(function (b) {
        var hit = !q || b.dataset.label.indexOf(q) > -1;
        b.parentElement.style.display = hit ? '' : 'none';
        if (hit) any = true;
      });
      wrap.style.display = any ? '' : 'none';
      var head = wrap.querySelector('.nav-group__head'), ul = wrap.querySelector('.nav-group__list');
      if (q) { head.setAttribute('aria-expanded', 'true'); ul.hidden = false; }
      else if (groupOf[document.querySelector('.screen-link[aria-current="true"]') ? document.querySelector('.screen-link[aria-current="true"]').dataset.name : ''] !== wrap) {
        head.setAttribute('aria-expanded', 'false'); ul.hidden = true;
      }
    });
    if (!q) { var cur = document.querySelector('.screen-link[aria-current="true"]'); if (cur) openGroup(groupOf[cur.dataset.name]); }
  });

  /* Ajusta o tamanho do celular à janela */
  var stage = document.getElementById('stage'), sizer = document.getElementById('sizer'), phone = document.getElementById('phone');
  function fit() {
    var s = Math.min(1, (stage.clientHeight - 32) / 948, (stage.clientWidth - 32) / 452);
    s = Math.max(s, 0.3);
    sizer.style.width = 452 * s + 'px'; sizer.style.height = 948 * s + 'px';
    phone.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit(); mark(START);
</script>
</body>
</html>
